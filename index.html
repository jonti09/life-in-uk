                                                                                                                                                                                      * { box-sizing: border-box; }

                                                                                                                                                                                                      header { margin-bottom: 1.5rem; }

                                                                                                                                                                                                                                          progress { display: block; width: 100%; height: .6rem; appearance: none; border: 0; border-radius: 1rem; background: var(--surface); accent-color: var(--blue); }
                                                                                                                                                                                                                                              progress::-webkit-progress-bar { background: var(--surface); border-radius: 1rem; }
                                                                                                                                                                                                                                                  progress::-webkit-progress-value { background: var(--blue); border-radius: 1rem; }
                                                                                                                                                                                                                                                      progress::-moz-progress-bar { background: var(--blue); border-radius: 1rem; }
                                                                                                                                                                                                                                                          .card { background: var(--mantle); border: 1px solid var(--surface); border-radius: 1rem; padding: 1.1rem; }
                                                                                                                                                                                                                                                              fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
                                                                                                                                                                                                                                                                  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
                                                                                                                                                                                                                                                                      #options { display: grid; gap: .65rem; }

                                                                                                                                                                                                                                                                              input { width: 1.2rem; height: 1.2rem; margin: .2rem 0 0; accent-color: var(--blue); }
                                                                                                                                                                                                                                                                                  .option:has(input:checked):not(.correct, .wrong) { border-color: var(--blue); }
                                                                                                                                                                                                                                                                                      .option.correct { border-color: var(--green); }
                                                                                                                                                                                                                                                                                          .option.wrong { border-color: var(--red); }
                                                                                                                                                                                                                                                                                              .option:has(input:disabled) { cursor: default; }
                                                                                                                                                                                                                                                                                                  .buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; margin-top: 1rem; }
                                                                                                                                                                                                                                                                                                      button { min-height: 2.8rem; padding: .65rem .8rem; border: 1px solid var(--surface); border-radius: .6rem; background: var(--base); color: var(--text); font: inherit; font-weight: 650; cursor: pointer; }
                                                                                                                                                                                                                                                                                                          .buttons button { padding: .65rem .3rem; font-size: .9rem; }
                                                                                                                                                                                                                                                                                                              button.primary { background: var(--blue); border-color: var(--blue); color: var(--button-text); }
                                                                                                                                                                                                                                                                                                                  button:disabled { opacity: .5; cursor: default; }

                                                                                                                                                                                                                                                                                                                          #feedback { margin-top: 1rem; border-top: 1px solid var(--surface); padding-top: 1rem; }
                                                                                                                                                                                                                                                                                                                              #feedback strong { display: block; margin-bottom: .5rem; }
                                                                                                                                                                                                                                                                                                                                  .score { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: 1rem 0 1.5rem; }
                                                                                                                                                                                                                                                                                                                                      .score div { border: 2px solid var(--green); border-radius: .7rem; padding: .8rem; }
                                                                                                                                                                                                                                                                                                                                          .score div:last-child { border-color: var(--red); }
                                                                                                                                                                                                                                                                                                                                              .score strong { display: block; font-size: 2rem; }
                                                                                                                                                                                                                                                                                                                                                  #wrong-answers { list-style: none; padding: 0; display: grid; gap: 1rem; }
                                                                                                                                                                                                                                                                                                                                                      .review-item { border-top: 1px solid var(--surface); padding-top: 1rem; }

                                                                                                                                                                                                                                                                                                                                                              .review-item p, .review-item li { overflow-wrap: anywhere; }
                                                                                                                                                                                                                                                                                                                                                                  .header-actions button { font-size: .85rem; padding: .4rem .75rem; }
                                                                                                                                                                                                                                                                                                                                                                      @media (min-width: 40rem) { main { padding-top: 2.5rem; } .card { padding: 1.5rem; } }
                                                                                                                                                                                                                                                                                                                                                                        </style>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script id="question-data" type="application/json">[{"exam":1,"number":1,"question":"What are two responsibilities that you will have as a British citizen or permanent resident of the UK?","options":[{"id":"r0","text":"To look after the area in which you live and the environment"},{"id":"r1","text":"To look after yourself and your family"},{"id":"r2","text":"To stay in the UK forever"},{"id":"r3","text":"To promote work in your local community"}],"correct":["r0","r1"],"explanation":"If you wish to be a permanent resident or citizen of the UK, you should: look after yourself and your family, look after the area in which you live and the environment , respect and obey the law, respect the rights of others, including their right to their own opinions and treat others with fairness."},{"exam":1,"number":2,"question":"Where is Big Ben located?","options":[{"id":"r0","text":"Buckingham Palace"},{"id":"r1","text":"The Tower of London"},{"id":"r2","text":"Trafalgar Square"},{"id":"r3","text":"The Houses of the Parliament"}],"correct":["r3"],"explanation":"Big Ben is the nickname for the great bell of the clock at the Houses of Parliament in London ."},{"exam":1,"number":3,"question":"When were men and women given the right to vote at the age of 21?","options":[{"id":"r0","text":"1918"},{"id":"r1","text":"1903"},{"id":"r2","text":"1928"},{"id":"r3","text":"1923"}],"correct":["r2"],"explanation":"In 1928 , women were given the right to vote at the age of 21, the same as men."},{"exam":1,"number":4,"question":"Where is the UK geographically located?","options":[{"id":"r0","text":"South west of Europe"},{"id":"r1","text":"North east of Europe"},{"id":"r2","text":"North west of Europe"},{"id":"r3","text":"South east of Europe"}],"correct":["r2"],"explanation":"The UK is located in the north west of Europe ."},{"exam":1,"number":5,"question":"Who is the patron Saint of Scotland?","options":[{"id":"r0","text":"St David"},{"id":"r1","text":"St Patrick"},{"id":"r2","text":"St George"},{"id":"r3","text":"St Andrew"}],"correct":["r3"],"explanation":"The patron Saint of Scotland is St Andrew ."},{"exam":1,"number":6,"question":"Which two houses fought in the Wars of the Roses?","options":[{"id":"r0","text":"The House of Chester"},{"id":"r1","text":"The House of York"},{"id":"r2","text":"The House of Lancaster"},{"id":"r3","text":"The House of Newcastle"}],"correct":["r1","r2"],"explanation":"The Wars of the Roses were fought between the supporters of two families: the House of Lancaster and the House of York ."},{"exam":1,"number":7,"question":"The Bill of Rights of 1689 confirmed the right to vote for all adult men.","options":[{"id":"r0","text":"True"},{"id":"r1","text":"False"}],"correct":["r1"],"explanation":"False . The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king’s power."},{"exam":1,"number":8,"question":"What is the Cenotaph?","options":[{"id":"r0","text":"A flower"},{"id":"r1","text":"A Christian church"},{"id":"r2","text":"A war memorial"},{"id":"r3","text":"A theatre"}],"correct":["r2"],"explanation":"The Cenotaph is a war memorial and it is the site of the annual Remembrance Day service attended by the King, politicians and foreign ambassadors."},{"exam":1,"number":9,"question":"Who was the first female Prime Minister of the UK?","options":[{"id":"r0","text":"Mary Stuart"},{"id":"r1","text":"Theresa May"},{"id":"r2","text":"Margaret Thatcher"},{"id":"r3","text":"Florence Nightingale"}],"correct":["r2"],"explanation":"Margaret Thatcher was the first woman Prime Minister of the UK."},{"exam":1,"number":10,"question":"Who chairs the debates at the House of Commons?","options":[{"id":"r0","text":"A bishop"},{"id":"r1","text":"The Prime Minister"},{"id":"r2","text":"The Speaker"},{"id":"r3","text":"The archbishop of Canterbury"}],"correct":["r2"],"explanation":"Debates in the House of Commons are chaired by the Speaker ."},{"exam":1,"number":11,"question":"Who was the captain of the English football team that won the World Cup in 1966?","options":[{"id":"r0","text":"Sir Roger Bannister"},{"id":"r1","text":"Sir Jackie Stewart"},{"id":"r2","text":"Sir Ian Botham"},{"id":"r3","text":"Bobby Moore"}],"correct":["r3"],"explanation":"Bobby Moore captained the English football team that won the World Cup in 1966."},{"exam":1,"number":12,"question":"When did the English defeat the Spanish Armada?","options":[{"id":"r0","text":"1466"},{"id":"r1","text":"1066"},{"id":"r2","text":"1254"},{"id":"r3","text":"1588"}],"correct":["r3"],"explanation":"In 1588 the English defeated the Spanish Armada."},{"exam":1,"number":13,"question":"Anyone can make a complaint about the police by writing to the Chief Constable of the police force involved.","options":[{"id":"r0","text":"True"},{"id":"r1","text":"False"}],"correct":["r0"],"explanation":"This statement is TRUE ."},{"exam":1,"number":14,"question":"What is the minimum age required to serve on a jury?","options":[{"id":"r0","text":"16"},{"id":"r1","text":"18"},{"id":"r2","text":"21"},{"id":"r3","text":"25"}],"correct":["r1"],"explanation":"Anyone who is on the electoral register and is aged 18 to 70 can be asked to serve on a jury."},{"exam":1,"number":15,"question":"How is a jury selected?","options":[{"id":"r0","text":"From the NHS registration system"},{"id":"r1","text":"Randomly from the electoral register"},{"id":"r2","text":"Alphabetically from the telephone directory"},{"id":"r3","text":"From a postcode selection"}],"correct":["r1"],"explanation":"As well as getting the right to vote, people on the electoral register are randomly selected to serve on a jury. Anyone who is on the electoral register and is aged 18 to 70 can be asked to do this."},{"exam":1,"number":16,"question":"What is a bank holiday?","options":[{"id":"r0","text":"A public holiday when banks are open all day"},{"id":"r1","text":"A public holiday for people working in banks"},{"id":"r2","text":"An additional day off that every worker in the UK is entitled to"},{"id":"r3","text":"A public holiday when banks and many other businesses are closed for the day"}],"correct":["r3"],"explanation":"There are public holidays each year called bank holidays, when banks and many other businesses are closed for the day ."},{"exam":1,"number":17,"question":"What will you be given to vote before a general election takes place?","options":[{"id":"r0","text":"A ballot slip"},{"id":"r1","text":"A poll card"},{"id":"r2","text":"A voting slip"},{"id":"r3","text":"A poll tax relief"}],"correct":["r1"],"explanation":"Before the election you will be sent a poll card ."},{"exam":1,"number":18,"question":"Which of the following statements is correct?","options":[{"id":"r0","text":"Solicitors’ charges are usually based on how much time they spend on a case"},{"id":"r1","text":"Solicitors’ charges are usually based on the nature of a case and its importance"}],"correct":["r0"],"explanation":"Solicitors’ charges are usually based on how much time they spend of a case."},{"exam":1,"number":19,"question":"By law, which TWO types of media have to give a balanced coverage of all political parties and equal time to rival viewpoints before an election?","options":[{"id":"r0","text":"Television"},{"id":"r1","text":"Internet"},{"id":"r2","text":"Newspapers"},{"id":"r3","text":"Radio"}],"correct":["r0","r3"],"explanation":"By law, radio and television coverage of the political parties must be balanced and so equal time has to be given to rival viewpoints."},{"exam":1,"number":20,"question":"Which of the following territories is a Crown dependency but is NOT part of the UK?","options":[{"id":"r0","text":"Northern Ireland"},{"id":"r1","text":"Wales"},{"id":"r2","text":"The Channel Islands"},{"id":"r3","text":"Scotland"}],"correct":["r2"],"explanation":"The Channel Islands is a British overseas territory linked to the UK, but it is not part of it."},{"exam":1,"number":21,"question":"What did Sir Frank Whittle invent in the 1930s?","options":[{"id":"r0","text":"Radar"},{"id":"r1","text":"Hovercraft"},{"id":"r2","text":"Jet engine"},{"id":"r3","text":"Ballpoint pen"}],"correct":["r2"],"explanation":"The jet engine was developed in Britain in the 1930s by Sir Frank Whittle ."},{"exam":1,"number":22,"question":"Who wrote ‘The Daffodils’?","options":[{"id":"r0","text":"William Blake"},{"id":"r1","text":"Robert Browning"},{"id":"r2","text":"Lord Byron"},{"id":"r3","text":"William Wordsworth"}],"correct":["r3"],"explanation":"The British poet William Wordsworth wrote ‘The Daffodils’."},{"exam":1,"number":23,"question":"Who was given the title of Lord Protector?","options":[{"id":"r0","text":"Charles I"},{"id":"r1","text":"Charles II"},{"id":"r2","text":"Winston Churchill"},{"id":"r3","text":"Oliver Cromwell"}],"correct":["r3"],"explanation":"Oliver Cromwell was given the title of Lord Protector and ruled until his death in 1658."},{"exam":1,"number":24,"question":"What are the 40 days before Easter called?","options":[{"id":"r0","text":"Diwali"},{"id":"r1","text":"Lent"},{"id":"r2","text":"Hannukah"},{"id":"r3","text":"Vaisakhi"}],"correct":["r1"],"explanation":"The 40 days before Easter are known as Lent ."},{"exam":2,"number":1,"question":"What is the Home Secretary responsible for?","options":[{"id":"r0","text":"Health"},{"id":"r1","text":"Defence"},{"id":"r2","text":"Education"},{"id":"r3","text":"Policing"}],"correct":["r3"],"explanation":"The Home Secretary is responsible for crime, policing and immigration ."},{"exam":2,"number":2,"question":"St Helena is a British overseas territory and it is part of the United Kingdom.","options":[{"id":"r0","text":"True"},{"id":"r1","text":"False"}],"correct":["r1"],"explanation":"British overseas territories, such as St Helena and the Falkland Islands are linked to the UK but are not part of it ."},{"exam":2,"number":3,"question":"Several Church of England bishops sit in the House of Lords.","options":[{"id":"r0","text":"True"},{"id":"r1","text":"False"}],"correct":["r0"],"explanation":"This statement is true ."},{"exam":2,"number":4,"question":"When walking your dog in a public place, you must ensure:","options":[{"id":"r0","text":"That your dog does not play with other dogs"},{"id":"r1","text":"That your dog wears a collar showing the name and address of the owner"},{"id":"r2","text":"That your dog wears a high visibility jacket"},{"id":"r3","text":"That your dog does not bark"}],"correct":["r1"],"explanation":"All dogs in public places must wear a collar showing the name and address of the owner ."},{"exam":2,"number":5,"question":"Women over the age of 30 were given the right to vote as a result of their contribution towards the war effort. Which war was that?","options":[{"id":"r0","text":"The Second World War"},{"id":"r1","text":"The Crimean War"},{"id":"r2","text":"The First World War"},{"id":"r3","text":"The Civil War"}],"correct":["r2"],"explanation":"In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War ."},{"exam":2,"number":6,"question":"When did Ireland become a republic?","options":[{"id":"r0","text":"1925"},{"id":"r1","text":"1939"},{"id":"r2","text":"1949"},{"id":"r3","text":"1927"}],"correct":["r2"],"explanation":"Ireland became a republic in 1949 ."},{"exam":2,"number":7,"question":"Where did the first farmers come from?","options":[{"id":"r0","text":"South-west Europe"},{"id":"r1","text":"South-east Europe"},{"id":"r2","text":"North-east America"},{"id":"r3","text":"North-west Asia"}],"correct":["r1"],"explanation":"The first farmers arrived in Britain 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe ."},{"exam":2,"number":8,"question":"Who was an important contributor to the ‘pop art’ movement of the 1960’s?","options":[{"id":"r0","text":"David Hockney"},{"id":"r1","text":"Lucian Freud"},{"id":"r2","text":"John Petts"},{"id":"r3","text":"Henry Moore"}],"correct":["r0"],"explanation":"David Hockney was an important contributor to the ‘pop art’ movement of the 1960s and continues to be influential today."},{"exam":2,"number":9,"question":"Who became Prime Minister and was an inspirational leader to the British people during WWII?","options":[{"id":"r0","text":"Winston Churchill"},{"id":"r1","text":"Clement Attlee"},{"id":"r2","text":"Margaret Thatcher"},{"id":"r3","text":"Sir Robert Walpole"}],"correct":["r0"],"explanation":"Winston Churchill ."},{"exam":2,"number":10,"question":"Who led the first invasion of Britain?","options":[{"id":"r0","text":"Emperor Hadrian"},{"id":"r1","text":"Julius Caesar"},{"id":"r2","text":"Canute"},{"id":"r3","text":"William, the Duke of Normandy"}],"correct":["r1"],"explanation":"Julius Caesar led a Roman invasion of Britain in 55 BC. This was unsuccessful and for nearly 100 years Britain remained separate from the Roman Empire. In AD 43 the Emperor Claudius led the Roman army in a new invasion. This time, there was resistance from some of the British tribes but the Romans were successful in occupying almost all of Britain."},{"exam":2,"number":11,"question":"Under which king did the Anglo-Saxon kingdoms in England unite to defeat the Vikings?","options":[{"id":"r0","text":"William of Orange"},{"id":"r1","text":"King Alfred the Great"},{"id":"r2","text":"Henry VIII"},{"id":"r3","text":"Robert the Bruce"}],"correct":["r1"],"explanation":"The Anglo-Saxon kingdoms in England united under King Alfred the Great , who defeated the Vikings."},{"exam":2,"number":12,"question":"Whe
